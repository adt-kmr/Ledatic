services:
  ml:
    build: { context: ./ml, dockerfile: Dockerfile.s390x }
    restart: unless-stopped
  backend:
    build: { context: ./backend, dockerfile: Dockerfile.s390x }
    restart: unless-stopped
  camara:
    build: { context: ./camara, dockerfile: Dockerfile.s390x }
    restart: unless-stopped
  postgres: { restart: unless-stopped }
  redis:    { restart: unless-stopped }
  web:
    image: nginx:stable-bookworm
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ${FRONTEND_DIST:-./frontend-dist}:/usr/share/nginx/html:ro
      - ./deploy/s390x/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - citadel
    depends_on:
      - backend
