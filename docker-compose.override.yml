services:
  backend:  { restart: unless-stopped }
  ml:       { restart: unless-stopped }
  camara:   { restart: unless-stopped }
  postgres: { restart: unless-stopped }
  redis:    { restart: unless-stopped }
  web:
    image: nginx:stable-bookworm
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - /home/linux1/frontend-dist:/usr/share/nginx/html:ro
      - /home/linux1/Ledatic/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - citadel
    depends_on:
      - backend
