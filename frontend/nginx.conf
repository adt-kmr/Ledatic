# Maps the client's Upgrade header to the value nginx must send upstream:
# "upgrade" for a WebSocket handshake, "close" for a normal request. Without
# this, adding a hard-coded Connection: upgrade would break every plain HTTP
# request through the same location block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the backend service.
    #
    # Carries WebSocket upgrades as well as REST: the phishing demo's Hacker
    # Terminal and the SOC live feeds run over /api/**/ws. HTTP/1.1 plus the
    # Upgrade and Connection headers are all required — without them nginx
    # silently downgrades the handshake and the socket never opens.
    #
    # proxy_pass to a bare hostname resolves it ONCE at config load and caches
    # that container IP forever. If the backend container is ever recreated
    # (restart, redeploy, `docker compose up` after a rebuild) it gets a new
    # Docker network IP, and nginx keeps proxying to the dead old one — every
    # request 502s until nginx itself is restarted. Routing through a variable
    # forces per-request resolution via Docker's embedded DNS (127.0.0.11)
    # instead, so a backend restart alone is enough to recover.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived: WebSockets and SSE streams sit idle between events, and
        # the old 120s read timeout dropped them mid-demo. Clients also ping.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # SSE must not be buffered or events arrive in batches, late.
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
